metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: opennebula-small
spec:
  autoprovision:
    providerid: opennebula
    providerdata: |
      schemaVersion: v1alpha1
      flavor: small
      templateName: talos-omni-base
      datastore: ssd-primary
      networks:
        - name: talos-prod
      networkContextMode: auto
      graphics:
        enabled: false
---
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: opennebula-medium
spec:
  autoprovision:
    providerid: opennebula
    providerdata: |
      schemaVersion: v1alpha1
      flavor: medium
      templateName: talos-omni-base
      datastore: ssd-primary
      networks:
        - name: talos-prod
        - name: talos-mgmt
      networkContextMode: auto
      rootDiskGiB: 80
      graphics:
        enabled: false
---
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: opennebula-large
spec:
  autoprovision:
    providerid: opennebula
    providerdata: |
      schemaVersion: v1alpha1
      resources:
        cpu: "8"
        vcpu: 8
        memoryMiB: 32768
        rootDiskGiB: 160
      templateName: talos-omni-base
      datastore: ceph-images
      networks:
        - name: talos-prod
      networkContextMode: manual
      staticNetwork:
        - name: eth0
          ip: 10.20.30.40
          gateway: 10.20.30.1
          dns:
            - 10.20.30.53
            - 1.1.1.1
      firmware:
        mode: uefi
        secureBoot: true
      graphics:
        enabled: false
