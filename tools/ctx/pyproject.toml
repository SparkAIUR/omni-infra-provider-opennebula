[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "omni-infra-provider-opennebula-ctx"
version = "0.1.0"
description = "Private contextual knowledge store for omni-infra-provider-opennebula."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.16.0,<1.0.0",
]

[project.scripts]
ctx = "ctxstore.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10.0,<2.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxstore"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
