          ceph_public_ip: 10.10.0.12
          ceph_osd_devices:
            - /dev/vdb
    ceph_managers:
      hosts:
        prod-fe-01:
        prod-hv-01:
    ceph_mdss:
      hosts:
        prod-fe-01:
        prod-hv-01:
    ceph_osd_hosts:
      hosts:
        prod-fe-01:
        prod-hv-01:
        prod-hv-02:
    opennebula_frontend:
      hosts:
        prod-fe-01:
