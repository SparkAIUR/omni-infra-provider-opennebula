      hosts:
        prod-fe-01:
          ansible_host: 10.10.0.10
          ceph_public_ip: 10.10.0.10
          ceph_osd_devices:
            - /dev/vdb
    ceph_monitors:
      hosts:
        prod-fe-01:
        prod-hv-01:
          ansible_host: 10.10.0.11
          ceph_public_ip: 10.10.0.11
          ceph_osd_devices:
            - /dev/vdb
        prod-hv-02:
