name: release-artifacts

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-edge.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          PUSH: "true"
          USERNAME: nudevco
        run: |
          make image-omni-infra-provider-opennebula IMAGE_TAG="${IMAGE_TAG}" PUSH="${PUSH}" USERNAME="${USERNAME}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and package chart
        run: |
          mkdir -p .charts
          helm lint helm/omni-infra-provider-opennebula
          helm package helm/omni-infra-provider-opennebula \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .charts

      - name: Publish chart to gh-pages
        run: |
          git fetch origin gh-pages || true
          rm -rf .gh-pages
          mkdir -p .gh-pages/charts
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add .gh-pages origin/gh-pages
          else
            git worktree add --detach .gh-pages
            (
              cd .gh-pages
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          mkdir -p .gh-pages/charts
          cp .charts/*.tgz .gh-pages/charts/
          helm repo index .gh-pages/charts --url https://sparkaiur.github.io/omni-infra-provider-opennebula/charts --merge .gh-pages/charts/index.yaml
          (
            cd .gh-pages
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add charts
            git commit -m "Publish charts for ${{ steps.version.outputs.version }}" || exit 0
            git push origin HEAD:gh-pages
          )
