{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omni-infra-provider-opennebula.serviceAccountName" . }}
  namespace: {{ include "omni-infra-provider-opennebula.namespace" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
