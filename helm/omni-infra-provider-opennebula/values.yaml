nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

replicaCount: 1

image:
  repository: docker.io/nudevco/omni-infra-provider-opennebula
  tag: 0.0.0-edge.local
  pullPolicy: IfNotPresent

imagePullSecrets: []

omni:
  endpoint: https://omni.example.com
  serviceAccount:
    existingSecret:
      name: ""
      key: key
    inlineKey: ""

credentials:
  existingSecret:
    name: ""
    key: credentials
  inlineAuth: ""

providerConfig:
  providerID: opennebula
  opennebula:
    endpoint: http://127.0.0.1:2633/RPC2
    templateName: talos-omni-base
    hypervisor: auto
    resourcePool: staging-kvm
  defaults:
    flavor: medium
    firmware: uefi
    secureBoot: false
    graphicsEnabled: false
    networkContextMode: auto
    hostnameStrategy: cluster-role-sequence
  imageManagement:
    importOnMiss: true
    requireChecksum: true
    artifactURLTemplate: https://factory.talos.dev/image/{{ .SchematicID }}/{{ .TalosVersion }}/opennebula-{{ .Arch }}.qcow2
    checksumURLTemplate: https://factory.talos.dev/image/{{ .SchematicID }}/{{ .TalosVersion }}/opennebula-{{ .Arch }}.qcow2.sha256
  observability:
    listenAddress: :9977
    metricsPath: /metrics
    healthPath: /healthz
    readyPath: /readyz
  flavors:
    medium:
      cpu: "4"
      vcpu: 4
      memoryMiB: 8192
      rootDiskGiB: 60

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 9977
  annotations: {}
  labels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

metrics:
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
