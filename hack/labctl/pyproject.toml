[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "omni-infra-provider-opennebula-labctl"
version = "0.1.0"
description = "Config-driven staging lab rebuild automation for omni-infra-provider-opennebula."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "typer>=0.16.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[project.scripts]
labctl = "labctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labctl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

